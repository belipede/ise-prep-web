    if (ok) { F.combo++; c.xp = 10 + (F.combo >= 3 ? 5 : 0); c.say = F.combo >= 3 ? `${F.combo} in a row! 🔥` : pick(KAI_RIGHT); sound("right"); earn(c.xp, F.combo >= 3 ? "combo" : ""); }
    else { F.combo = 0; c.say = pick(KAI_WRONG); sound("wrong"); }
    save();
    const el = document.querySelector(`[data-card="${i}"]`); if (el) el.outerHTML = feedCard(c, i);
    renderHud();
  }

  // ---------- Lesson screen: notes, then questions one at a time, or a hands-on activity ----------
  function openLesson(id) {
    const t = taskById(id), key = lessonOf(t); if (!key) return;
    const q = S.quiz[id] || { best: null, attempts: 0 };
    const L = LESSONS[key];
    ui.lesson = { id, key, step: "notes", i: 0, results: [], picked: null, input: "", checked: null, started: Date.now(), qs: L.activity ? [] : lessonQuestions(key, hashStr(id + ":" + q.attempts)) };
  }
  function lessonAnswer(ok) {
    const l = ui.lesson; l.checked = ok; l.results.push(ok);
    if (ok) { l.combo = (l.combo || 0) + 1; const x = 10 + (l.combo >= 3 ? 5 : 0); l.xp = (l.xp || 0) + x; l.gain = x; l.say = l.combo >= 3 ? `${l.combo} in a row! 🔥` : pick(KAI_RIGHT); sound("right"); earn(x, l.combo >= 3 ? "combo" : ""); save(); }
    else { l.combo = 0; l.gain = 0; l.say = pick(KAI_WRONG); sound("wrong"); }
  }
  function lessonDone() {
    const l = ui.lesson, t = taskById(l.id);
    if (!t.done) {
      setDone(t, true);
      const mins = Math.max(5, Math.min(t.mins, Math.ceil((Date.now() - l.started) / 60000 / 5) * 5));
      S.logs.push({ id: uid(), day: today(), mins, taskId: t.id, topic: "" });
      earn(30, "session done"); confetti(50); sound("goal");
    }
    ui.lesson = null; save();
  }
  const activityReady = key => key === "outline" ? OUTLINE.every(([k]) => (S.notes["case-" + k] || "").trim()) : key === "draft" ? words(S.notes["case-draft"]) >= 150 : key === "meal" ? !!S.mealSolved : key === "check3" ? words(S.notes["case-draft"]) >= 150 && !!S.mealSolved : false;
  function renderActivity(L, t) {
    let h = "";
    if (L.activity === "outline") {
      for (const [k, lbl] of OUTLINE) h += `<label>${esc(lbl)}</label><textarea data-note="case-${k}" style="min-height:70px;font-family:inherit;font-size:15px">${esc(S.notes["case-" + k] || "")}</textarea>`;
    } else if (L.activity === "draft") {
      const out = OUTLINE.map(([k, lbl]) => S.notes["case-" + k] ? `<p class="small"><b>${esc(lbl.split(":")[0])}:</b> ${esc(S.notes["case-" + k])}</p>` : "").join("");
      if (out) h += `<div class="card">${out}</div>`;
      h += `<label>Draft (${words(S.notes["case-draft"])} words, aim for 250 to 400)</label><textarea data-note="case-draft" style="min-height:260px;font-family:inherit;font-size:15px">${esc(S.notes["case-draft"] || "")}</textarea>`;
    } else if (L.activity === "meal") {
      const q = S.meal, cost = mealCost(q), pr = mealProtein(q), ok = pr >= MEAL_TARGET;
      h += `<table class="xl"><tr><th>Food</th><th>Cost</th><th>Protein</th><th>Servings</th></tr>${FOODS.map((f, i) => `<tr><td>${esc(f.name)}</td><td>$${f.cost.toFixed(2)}</td><td>${f.protein} g</td><td><button type="button" class="btn small ghost" data-act="meal" data-i="${i}" data-d="-1" aria-label="Fewer ${esc(f.name)}">−</button> <b>${q[i]}</b> <button type="button" class="btn small ghost" data-act="meal" data-i="${i}" data-d="1" aria-label="More ${esc(f.name)}">+</button></td></tr>`).join("")}</table>`;
      h += `<p>Protein: <b>${pr} g</b> ${ok ? "✓ meets 60 g" : `(need ${MEAL_TARGET - pr} g more)`} · Cost: <b>$${cost.toFixed(2)}</b></p>`;
      if (S.mealSolved) h += `<div class="fb right">Solved: $${MEAL_BEST.toFixed(2)} is the cheapest way to get 60 g. This is what Solver does automatically: it searches all combinations, and on big problems it uses clever maths so it doesn't have to.</div>`;
      else if (ok && cost <= MEAL_BEST + 1e-9) h += `<div class="fb right">That's the cheapest possible: $${cost.toFixed(2)}.</div>`;
      else if (ok) h += `<div class="fb wrong">Meets the target, but there's a cheaper combination. Hint: compare cost per gram of protein.</div>`;
    } else if (L.activity === "check3") {
      const w = words(S.notes["case-draft"]);
      h += `<div class="row"><div class="grow">Case study draft: ${w} words</div><span class="status ${w >= 150 ? "ok" : "late"}">${w >= 150 ? "Done" : "Needs 150+"}</span></div><div class="row"><div class="grow">Cheapest protein plan found</div><span class="status ${S.mealSolved ? "ok" : "late"}">${S.mealSolved ? "Done" : "Not yet"}</span></div>`;
    }
    const ready = activityReady(L.activity);
    h += `<div class="btns">${t.done ? "" : `<button type="button" class="btn" data-act="lessonFinish" ${ready ? "" : "disabled style=\"opacity:.5\""}>Mark this session done</button>`}<button type="button" class="btn ghost" data-act="lessonClose">${t.done || !ready ? "Close (saved)" : "Close"}</button></div>`;
    if (!ready && !t.done) h += `<p class="small muted">${L.activity === "outline" ? "Fill in all five headings to finish." : L.activity === "draft" ? "Write at least 150 words to finish." : L.activity === "meal" ? "Find the cheapest combination to finish." : "Finish the case study draft and the protein puzzle first."}</p>`;
    return h;
  }
  function renderLessonBody() {
    const l = ui.lesson, L = LESSONS[l.key], t = taskById(l.id);
    let h = `<p class="eyebrow">${esc(t.title)}</p><h2>${esc(L.title)}</h2>`;
    if (L.activity) return h + `<div class="notes">${L.notes}</div>` + renderActivity(L, t);
    if (l.step === "notes") return h + `<div class="notes">${L.notes}</div><div class="btns"><button type="button" class="btn" data-act="lessonGo">Practice (${l.qs.length} questions)</button><button type="button" class="btn ghost" data-act="lessonClose">Close</button></div>`;
    if (l.step === "end") {
      const right = l.results.filter(Boolean).length, pct = Math.round(right / l.qs.length * 100), pass = pct >= 80;
      h += `<div style="display:grid;place-items:center;margin:8px 0">${kai(pass ? "cheer" : pct >= 50 ? "wow" : "sad", 110, pass ? "jump" : "bob")}<p style="font-size:22px;font-weight:900;margin:8px 0 0">${pct === 100 ? "Perfect! 💯" : pass ? "Passed! 🎉" : pct >= 50 ? "So close!" : "Good effort!"}</p><p class="muted" style="margin:2px 0;font-weight:700">+${l.xp || 0} XP this round</p></div>`;
      h += `<div class="fb ${pass ? "right" : "wrong"}"><b>${right} of ${l.qs.length} (${pct}%).</b> ${pass ? "Passed." : "Not quite 80% yet. Read the notes again and retry: you'll get new numbers."}</div>`;
      h += `<div class="btns">${pass && !t.done ? `<button type="button" class="btn go" data-act="lessonFinish">Mark this session done</button>` : ""}<button type="button" class="btn ${pass && !t.done ? "ghost" : ""}" data-act="lessonRetry">Try new questions</button><button type="button" class="btn ghost" data-act="lessonClose">Close</button></div>`;
      return h;
    }
    const q = l.qs[l.i];
    h += `<div class="lbar"><a href="#" class="x" data-act="lessonClose" aria-label="Close">✕</a><div class="bar"><i style="width:${Math.round((l.i + (l.checked !== null ? 1 : 0)) / l.qs.length * 100)}%"></i></div>${(l.combo || 0) >= 2 ? `<span class="combo">🔥 ${l.combo}</span>` : ""}</div>`;
    h += `<p class="qcount">Question ${l.i + 1} of ${l.qs.length} · <a href="#" data-act="lessonNotes">${l.showNotes ? "hide notes" : "notes"}</a></p>${l.showNotes ? `<div class="card notes">${L.notes}</div>` : ""}<p class="qtext">${q.q}</p>`;
    if (q.type === "mc") {
      h += q.choices.map((c, k) => `<button type="button" class="choice ${l.checked !== null ? (k === q.ans ? "right" : k === l.picked ? "wrong" : "") : ""}" data-act="pick" data-k="${k}" ${l.checked !== null ? "disabled" : ""}>${esc(c)}</button>`).join("");
    } else {
      h += `<input id="ans" inputmode="decimal" autocomplete="off" placeholder="Your answer" value="${esc(l.input)}" ${l.checked !== null ? "disabled" : ""}>`;
      if (l.checked === null) h += `<div class="btns"><button type="button" class="btn" data-act="checkNum">Check</button><button type="button" class="btn ghost" data-act="skipQ">I don't know</button></div>`;
    }
    if (l.bad) h += `<p class="err">Type a number, like 12, -3, 0.25 or 1/6.</p>`;
    if (l.checked !== null) {
      h += `<div style="display:flex;align-items:center;gap:10px;margin-top:10px">${kai(l.checked ? "cheer" : "sad", 50, l.checked ? "jump" : "shake")}<b style="font-size:17px">${esc(l.say || "")}${l.checked && l.gain ? ` <span style="color:var(--warn)">+${l.gain} XP</span>` : ""}</b></div>`;
      h += `<div class="fb ${l.checked ? "right" : "wrong"}"><b>${l.checked ? "Right." : `Not quite. The answer is ${q.type === "mc" ? esc(q.choices[q.ans]) : showAns(q.ans)}.`}</b> ${q.explain}</div><div class="btns"><button type="button" class="btn big ${l.checked ? "go" : ""}" data-act="nextQ">${l.i + 1 < l.qs.length ? "Continue" : "See score"}</button></div>`;
    }
    return h;
  }

  function renderMore() {
    const G = S.game;
    let h = `<div class="card"><h2>Daily goal and streak</h2><p class="small muted">XP you aim for each day. Meet it to keep your streak going.</p><div class="chips">${[[20, "Chill"], [30, "Regular"], [50, "Serious"], [100, "Beast"]].map(([v, l]) => `<button type="button" class="chip ${G.goal === v ? "on" : ""}" data-act="setGoal" data-v="${v}">${l} · ${v} XP</button>`).join("")}</div>`;
    h += G.pause ? `<p class="small"><b>Streak paused since ${fmtDay(G.pause)}.</b> It resumes when you meet your goal, or tap below.</p><div class="btns"><button type="button" class="btn small" data-act="resumeStreak">I'm back, resume streak</button></div>`
      : `<p class="small muted">Going on exercise, field camp or a stay-in week without your phone? Pause your streak so it doesn't reset.</p><div class="btns"><button type="button" class="btn small ghost" data-act="pauseStreak">Pause streak</button></div>`;
    h += `<label style="display:flex;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" data-act="toggleSound" ${G.sound ? "checked" : ""} style="width:auto"> Sound effects</label></div>`;
    h += `<div class="card"><h2>ORD date</h2><p class="small muted">From the week of ORD, weeks you haven't checked in for assume 5.5 hours over Mon, Wed and Sat instead of 1 hour on Sat.</p><form data-form="ord"><input type="date" name="ord" value="${S.ord}" required><div class="btns"><button class="btn small">Save ORD date</button></div></form></div>`;
    h += `<div class="card"><h2>Process ideas from NS</h2><p class="small muted">Bottlenecks or wasteful processes you notice. Leave out names and anything sensitive. The best one becomes a case study.</p><form data-form="idea"><input name="text" placeholder="e.g. Queue at the stores counter on Mondays" required maxlength="300"><div class="btns"><button class="btn small">Add idea</button></div></form>`;
    for (const i of [...S.ideas].reverse()) h += `<div class="row"><div class="grow"><div class="title">${esc(i.text)}</div><div class="small muted">${fmtDay(i.day)}</div></div><button type="button" class="btn small ghost" data-act="delIdea" data-id="${i.id}">Delete</button></div>`;
    h += `</div>`;
    h += `<div class="card"><h2>Your data</h2><p class="small muted">Everything is stored only on this phone. Export now and then to keep a copy somewhere safe.</p>${ui.msg ? `<p class="msg">${esc(ui.msg)}</p>` : ""}<div class="btns"><button type="button" class="btn small" data-act="export">${ui.exportShown ? "Hide export" : "Export"}</button><button type="button" class="btn small ghost" data-act="download">Download file</button></div>`;
    if (ui.exportShown) h += `<label>Copy this text and keep it somewhere safe</label><textarea readonly id="exportText">${esc(JSON.stringify(S))}</textarea>`;
    h += `<form data-form="import"><label>Import: paste an export here</label><textarea name="text" placeholder="{&quot;v&quot;:1, ...}"></textarea>${ui.err ? `<p class="err">${esc(ui.err)}</p>` : ""}<div class="btns"><button class="btn small ghost">Import</button></div></form></div>`;
    const baks = listBackups();
    h += `<div class="card"><h2>Automatic backups</h2><p class="small muted">One a day (last 7) and one before every import, restore or Start over (last 5).</p>`;
    if (!baks.length) h += `<p class="small muted">None yet. The first one is made the first time you change something on a new day.</p>`;
    for (const b of baks.slice(0, 15)) h += `<div class="row"><div class="grow"><div class="title">${BAK_WHY[b.reason] || b.reason}</div><div class="small muted">${new Date(b.at).toLocaleString()}</div></div><button type="button" class="btn small ghost" data-act="restore" data-key="${esc(b.key)}">Restore</button></div>`;
    h += `</div>`;
    h += `<div class="card"><h2>Start over</h2><p class="small muted">Clears your logs and check-ins and reloads the original plan. A backup is kept first.</p>${ui.confirm === "reset" ? `<p><b>Are you sure?</b></p><div class="btns"><button type="button" class="btn danger small" data-act="resetYes">Yes, start over</button><button type="button" class="btn ghost small" data-act="cancel">Cancel</button></div>` : `<div class="btns"><button type="button" class="btn ghost small" data-act="reset">Start over</button></div>`}</div>`;
    h += `<p class="small muted">ISE Prep ${VERSION}. How planning works: each week's free time is filled with the next unfinished tasks in plan order. Anything unfinished carries into next week. The projection assumes the time from your check-ins, and the defaults for weeks you haven't checked in yet.</p>`;
    return h;
  }

  function renderLocked() {
    document.getElementById("eyebrow").textContent = "Your data needs attention";
    document.getElementById("heading").textContent = "Couldn't read your saved data";
    view.innerHTML = `<div class="card warn"><p>The saved data on this phone couldn't be read, so the app hasn't changed or overwritten it.</p><p class="small">Copy the text below and keep it. You can try importing it later, or restore an automatic backup from before the problem.</p><textarea readonly>${esc(LOCKED)}</textarea><div class="btns"><button type="button" class="btn" data-act="lockedFresh">Keep a copy and start fresh</button></div></div>` +
      listBackups().filter(b => b.reason !== "unreadable").slice(0, 7).map(b => `<div class="row"><div class="grow"><div class="title">${BAK_WHY[b.reason] || b.reason}</div><div class="small muted">${new Date(b.at).toLocaleString()}</div></div><button type="button" class="btn small ghost" data-act="restore" data-key="${esc(b.key)}">Restore</button></div>`).join("");
  }

  function renderSheet() {
    const el = document.getElementById("sheet"), s = ui.sheet;
    if (ui.lesson) { el.innerHTML = `<div class="back"></div><div class="panel" role="dialog" aria-modal="true" style="max-height:96vh;min-height:70vh"><div class="in">${renderLessonBody()}</div></div>`; return; }
    if (!s) { el.innerHTML = ""; return; }
    let h = "";
    if (s.kind === "checkin") {
      const cur = s.draft;
      h = `<h2>How free are you, week of ${fmtDay(s.wk)}?</h2><p class="small muted">Count only time you'll really have. Field camp or stay-in week? Pick 0.</p><label>Total time</label><div class="chips">${[0, 30, 60, 90, 120, 180, 240, 330, 420].map(m => `<button type="button" class="chip ${cur.mins === m ? "on" : ""}" data-act="ciMins" data-m="${m}">${m ? hm(m) : "0"}</button>`).join("")}</div><label>Which days</label><div class="chips">${DAYS.map((d, i) => `<button type="button" class="chip ${cur.days.includes(i) ? "on" : ""}" data-act="ciDay" data-d="${i}">${d}</button>`).join("")}</div><label>Where you'll study</label><div class="chips">${[["phone", "Phone only"], ["laptop", "Laptop"], ["both", "Both"]].map(([v, l]) => `<button type="button" class="chip ${cur.mode === v ? "on" : ""}" data-act="ciMode" data-v="${v}">${l}</button>`).join("")}</div><p class="small">${availText({ ...cur, days: cur.days })}</p><div class="btns"><button type="button" class="btn" data-act="ciSave">Save check-in</button><button type="button" class="btn ghost" data-act="close">Cancel</button></div>`;
    } else if (s.kind === "log") {
      const pend = S.tasks.filter(t => !t.done).sort(byPlan).slice(0, 25);
      h = `<h2>Log study time</h2><form data-form="log"><label>Minutes</label><div class="chips">${[15, 30, 45, 60, 90].map(m => `<button type="button" class="chip ${s.mins === m ? "on" : ""}" data-act="logMins" data-m="${m}">${m}</button>`).join("")}</div><input name="mins" type="number" min="1" max="600" value="${s.mins}" required><label>What you studied</label><select name="taskId"><option value="">Something else</option>${pend.map(t => `<option value="${t.id}" ${t.id === s.taskId ? "selected" : ""}>${esc(t.title)}</option>`).join("")}</select><label>Note (for something else)</label><input name="topic" maxlength="120" placeholder="e.g. Watched a stats video"><label><input type="checkbox" name="done" style="width:auto"> Mark the task done</label><div class="btns"><button class="btn">Save</button><button type="button" class="btn ghost" data-act="close">Cancel</button></div></form>`;
    }
    el.innerHTML = `<div class="back" data-act="close"></div><div class="panel" role="dialog" aria-modal="true"><div class="in">${h}</div></div>`;
  }

  function render() {
    if (LOCKED !== null) { renderLocked(); return; }
    const titles = { feed: ["Swipe up for more", "Quick cards"], today: ["Week of " + fmtDay(thisWeek()), "This week"], plan: ["Dec 2026 to Jul 2028", "Your plan"], log: ["Study log", "Progress"], learn: ["Lessons and practice", "Learn"], more: ["Settings and data", "More"] };
    document.getElementById("eyebrow").textContent = titles[tab][0];
    document.getElementById("heading").textContent = titles[tab][1];
    for (const b of document.querySelectorAll("nav.tabs button")) b.classList.toggle("on", b.dataset.tab === tab);
    document.body.classList.toggle("feedon", tab === "feed");
    document.getElementById("titles").hidden = tab === "feed";
    renderHud();
    view.innerHTML = { feed: renderFeed, today: renderToday, plan: renderPlan, log: renderLog, learn: renderLearn, more: renderMore }[tab]();
    if (tab === "feed") feedAfterRender();
    renderSheet();
  }

  // ---------- Actions ----------
  function setDone(t, on) { t.done = on; t.doneOn = on ? today() : null; }
  document.addEventListener("click", e => {
    const tb = e.target.closest("nav.tabs button");
    if (tb) { tab = tb.dataset.tab; ui.msg = ""; ui.err = ""; ui.confirm = null; ui.kaiLine = ""; render(); window.scrollTo(0, 0); return; }
    const a = e.target.closest("[data-act]"); if (!a) return;
    const act = a.dataset.act, id = a.dataset.id;
    if (a.tagName === "A") e.preventDefault();
    if (LOCKED !== null && !["lockedFresh", "restore"].includes(act)) return;
    if (act === "fpick" || act === "fcheck" || act === "fskip") {
      const i = Number(a.dataset.c), c = ui.feed && ui.feed.cards[i]; if (!c || c.checked !== null) return;
      if (act === "fpick") { c.picked = Number(a.dataset.k); feedAnswer(i, c.picked === c.q.ans); }
      else if (act === "fskip") feedAnswer(i, false);
      else {
        const inp = document.querySelector(`[data-fc="${i}"]`); c.input = inp ? inp.value : "";
        const r = checkNum(c.input, c.q.ans);
        if (r === null) { c.bad = true; const el = document.querySelector(`[data-card="${i}"]`); if (el) el.outerHTML = feedCard(c, i); return; }
        c.bad = false; feedAnswer(i, r);
      }
      return;
    }
    if (act === "kaiTap") {
      sound("tap"); ui.kaiLine = pick(KAI_TAP.filter(x => x !== ui.kaiLine));
      if (tab === "today" && !ui.lesson) { ui.kaiAnim = "jump"; render(); }
      else { a.classList.remove("bob", "jump", "shake"); a.getBoundingClientRect(); a.classList.add("jump"); toast(ui.kaiLine); }
      return;
    }
    switch (act) {
      case "goFeed": tab = "feed"; render(); window.scrollTo(0, 0); return;
      case "setGoal": S.game.goal = Number(a.dataset.v); save(); break;
      case "toggleSound": S.game.sound = !S.game.sound; save(); if (S.game.sound) sound("right"); break;
      case "pauseStreak": pauseStreak(S.game, today()); save(); break;
      case "resumeStreak": settle(S.game, today()); save(); break;
      case "toggle": { const t = taskById(id); setDone(t, !t.done); save(); break; }
      case "checkin": { const wk = a.dataset.wk, av = availability(S, wk); ui.sheet = { kind: "checkin", wk, draft: { mins: av.mins, days: [...av.days], mode: av.mode } }; break; }
      case "ciMins": ui.sheet.draft.mins = Number(a.dataset.m); break;
      case "ciDay": { const d = Number(a.dataset.d), ds = ui.sheet.draft.days; ui.sheet.draft.days = ds.includes(d) ? ds.filter(x => x !== d) : [...ds, d].sort((x, y) => x - y); break; }
      case "ciMode": ui.sheet.draft.mode = a.dataset.v; break;
      case "ciSave": { const d = ui.sheet.draft; S.weeks[ui.sheet.wk] = { mins: d.mins, days: d.days.length ? d.days : [5], mode: d.mode }; ui.sheet = null; save(); break; }
      case "log": ui.sheet = { kind: "log", taskId: id || "", mins: Number(a.dataset.mins) || 30 }; break;
      case "logMins": { const inp = document.querySelector('#sheet input[name="mins"]'); if (inp) inp.value = a.dataset.m; ui.sheet.mins = Number(a.dataset.m); for (const c of document.querySelectorAll('#sheet [data-act="logMins"]')) c.classList.toggle("on", c === a); return; }
      case "close": ui.sheet = null; break;
      case "openPhase": ui.open[a.dataset.ph] = !ui.open[a.dataset.ph]; break;
      case "delTask": S.tasks = S.tasks.filter(t => t.id !== id); S.logs.forEach(l => { if (l.taskId === id) l.taskId = null; }); save(); break;
      case "delLog": S.logs = S.logs.filter(l => l.id !== id); save(); break;
      case "cycleRes": { const r = S.resources.find(x => x.id === id); r.status = { todo: "doing", doing: "done", done: "todo" }[r.status]; save(); break; }
      case "delIdea": S.ideas = S.ideas.filter(i => i.id !== id); save(); break;
      case "export": ui.exportShown = !ui.exportShown; break;
      case "download": { const blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" }); const u = URL.createObjectURL(blob); const l = document.createElement("a"); l.href = u; l.download = `ise-prep-${today()}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); return; }
      case "restore": {
        const b = listBackups().find(x => x.key === a.dataset.key); if (!b) break;
        let d; try { d = validate(JSON.parse(b.data)); } catch (err) { ui.err = "That backup couldn't be read."; break; }
        if (LOCKED === null) writeBackup("before-restore", JSON.stringify(S));
        else { writeBackup("unreadable", LOCKED); LOCKED = null; }
        S = d; cacheLocal(); ui.msg = "Backup restored."; tab = LOCKED === null ? tab : "today"; break;
      }
      case "reset": ui.confirm = "reset"; break;
      case "cancel": ui.confirm = null; break;
      case "resetYes": writeBackup("before-reset", JSON.stringify(S)); S = EMPTY(); ui.confirm = null; save(); ui.msg = "Started over with the original plan."; break;
      case "lockedFresh": writeBackup("unreadable", LOCKED); LOCKED = null; S = EMPTY(); save(); tab = "today"; break;
      case "retrySave": save(); break;
      case "lesson": ui.sheet = null; openLesson(id); break;
      case "lessonGo": ui.lesson.step = "q"; break;
      case "lessonNotes": ui.lesson.showNotes = !ui.lesson.showNotes; break;
      case "lessonClose": ui.lesson = null; break;
      case "pick": { const l = ui.lesson, q = l.qs[l.i]; if (l.checked !== null) break; l.picked = Number(a.dataset.k); lessonAnswer(l.picked === q.ans); break; }
      case "checkNum": { const l = ui.lesson, inp = document.getElementById("ans"); l.input = inp ? inp.value : ""; const r = checkNum(l.input, l.qs[l.i].ans); if (r === null) { l.bad = true; break; } l.bad = false; lessonAnswer(r); break; }
      case "skipQ": { const l = ui.lesson; l.bad = false; lessonAnswer(false); break; }
      case "nextQ": { const l = ui.lesson; l.i++; l.picked = null; l.input = ""; l.checked = null; l.showNotes = false; if (l.i >= l.qs.length) { l.step = "end"; const pct = Math.round(l.results.filter(Boolean).length / l.qs.length * 100), q = S.quiz[l.id] || { best: null, attempts: 0 }; S.quiz[l.id] = { best: Math.max(q.best ?? 0, pct), attempts: q.attempts + 1 }; save(); if (pct >= 80) { confetti(pct === 100 ? 70 : 40); sound("goal"); } } break; }
      case "lessonRetry": { const id2 = ui.lesson.id; openLesson(id2); ui.lesson.step = "q"; break; }
      case "lessonFinish": { const L = LESSONS[ui.lesson.key]; if (L.activity && !activityReady(L.activity)) break; lessonDone(); break; }
      case "meal": { const i = Number(a.dataset.i); S.meal[i] = Math.max(0, Math.min(5, S.meal[i] + Number(a.dataset.d))); if (mealProtein(S.meal) >= MEAL_TARGET && mealCost(S.meal) <= MEAL_BEST + 1e-9) S.mealSolved = true; save(); break; }
      case "toggleOutside": ui.showOutside = !ui.showOutside; break;
    }
    render();
  });
  document.addEventListener("submit", e => {
    const f = e.target.closest("form[data-form]"); if (!f) return;
    e.preventDefault();
    if (LOCKED !== null) return;
    const v = n => (f.elements[n] ? f.elements[n].value : "").trim();
    switch (f.dataset.form) {
      case "addTask": { const ph = Number(f.dataset.ph), mx = Math.max(0, ...S.tasks.map(t => t.order)); if (!v("title")) return; S.tasks.push({ id: uid(), phase: ph, title: v("title"), mins: Number(v("mins")) || 60, mode: v("mode") === "laptop" ? "laptop" : "phone", order: mx + 1, done: false, doneOn: null, custom: true }); break; }
      case "log": {
        const mins = Math.round(Number(v("mins"))); if (!(mins > 0 && mins <= 600)) return;
        const taskId = v("taskId") || null;
        S.logs.push({ id: uid(), day: today(), mins, taskId, topic: taskId ? "" : v("topic") });
        if (taskId && f.elements.done.checked) setDone(taskById(taskId), true);
        ui.sheet = null; break;
      }
      case "addRes": { if (!v("title")) return; const url = v("url"); S.resources.push({ id: uid(), phase: Number(v("phase")) || 1, title: v("title"), url: /^https?:\/\//.test(url) ? url : "", skill: "", mode: v("mode") === "laptop" ? "laptop" : "phone", status: "todo" }); break; }
      case "ord": { const d = v("ord"); if (!keyOk(d)) return; S.ord = d; ui.msg = ""; break; }
      case "idea": { if (!v("text")) return; S.ideas.push({ id: uid(), day: today(), text: v("text") }); break; }
      case "import": {
        let d; try { d = validate(JSON.parse(v("text"))); } catch (err) { ui.err = "Couldn't import: " + (err.message || "that isn't valid export text."); render(); return; }
        writeBackup("before-import", JSON.stringify(S)); S = d; ui.err = ""; ui.msg = "Imported. Your previous data is kept as a backup."; break;
      }
    }
    save(); render();
  });

  // Writing activities save as you type. Enter in an answer box checks it.
  document.addEventListener("input", e => {
    const n = e.target.dataset && e.target.dataset.note; if (!n || LOCKED !== null) return;
    S.notes[n] = e.target.value; save();
    if (n === "case-draft") { const lbl = e.target.previousElementSibling; if (lbl) lbl.textContent = `Draft (${words(e.target.value)} words, aim for 250 to 400)`; }
    const fin = document.querySelector('[data-act="lessonFinish"]'); const L = ui.lesson && LESSONS[ui.lesson.key];
    if (fin && L && L.activity) { const r = activityReady(L.activity); fin.disabled = !r; fin.style.opacity = r ? "" : ".5"; }
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    if (e.target.id === "ans") { e.preventDefault(); const b = document.querySelector('[data-act="checkNum"]'); if (b) b.click(); }
    const fc = e.target.dataset && e.target.dataset.fc; if (fc != null) { e.preventDefault(); const b = document.querySelector(`[data-act="fcheck"][data-c="${fc}"]`); if (b) b.click(); }
  });

  // ---------- Start ----------
  S = readLocal();
  if (LOCKED === null && !S) { S = EMPTY(); cacheLocal(); }
  render();
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
