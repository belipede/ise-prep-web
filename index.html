<style>
/* Design: an engineer's notebook. Warm paper, navy ink, NUS-style blue for actions, and Kai orange for anything you earn.
   Blueprint grid on the goal card and question cards, ruled paper on notes. One phone column, a fixed tab bar, sheets slide up. */
:root {
  --bg: #f8f4ec; --surface: #ffffff; --sunk: #f1ece2; --ink: #16213b; --muted: #5d6478; --line: #e6dfd1; --line-2: #d6cdbb;
  --accent: #1f4fd1; --accent-dk: #14389e; --accent-soft: #e5ecfc; --accent-ink: #ffffff;
  --navy: #13224a; --navy-2: #1b2f63;
  --good: #0f7d47; --good-dk: #0a5a33; --good-soft: #dff4e7; --warn: #a65400; --warn-soft: #fdefd8;
  --bad: #d4334a; --bad-dk: #9c1f33; --bad-soft: #fde6e9; --sun: #ffc83d; --flame: #f26a0c; --kai: #ff9f1c;
  --p1: #1f4fd1; --p2: #0e8796; --p3: #e2620f; --p4: #c2367a;
  --radius: 22px; --font: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 1px 0 rgba(22,33,59,.04), 0 10px 24px -18px rgba(22,33,59,.35);
  --grid: rgba(255,255,255,.07);
  --navh: 64px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0c1222; --surface: #151d33; --sunk: #10172b; --ink: #edf0f7; --muted: #a2aac0; --line: #243052; --line-2: #2f3d66;
    --accent: #7d9fff; --accent-dk: #4565c9; --accent-soft: #1d2a52; --accent-ink: #0c1222;
    --navy: #17254f; --navy-2: #1e3168;
    --good: #45d38a; --good-dk: #23955a; --good-soft: #12301f; --warn: #ffb14d; --warn-soft: #2e2213;
    --bad: #ff6e82; --bad-dk: #b33349; --bad-soft: #36161f; --flame: #ff8a3d;
    --shadow: 0 1px 0 rgba(0,0,0,.2); color-scheme: dark; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 10px) 18px calc(env(safe-area-inset-bottom, 0px) + var(--navh) + 36px); }
header.top { padding: 2px 2px 16px; }
.hud { display: flex; align-items: center; gap: 6px; margin: 0 0 14px; font-variant-numeric: tabular-nums; }
.hud .pill { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; font-size: 15px; padding: 6px 12px 6px 10px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.hud .pill.flame { color: color-mix(in srgb, var(--flame) 78%, var(--ink)); } .hud .pill.flame.cold { color: var(--muted); filter: grayscale(1); }
.hud .pill.xp { color: var(--accent); }
.hud .pill.lvl { color: var(--ink); }
.hud .grow { flex: 1; }
.ring { --p: 0; width: 40px; height: 40px; border-radius: 50%; background: conic-gradient(var(--flame) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; flex: none; }
.ring::after { content: attr(data-l); width: 32px; height: 32px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.ring.full { background: var(--good); }
.ring.full::after { content: "✓"; color: var(--good); font-size: 16px; }
.eyebrow { margin: 0; color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
h1 { margin: 2px 0 0; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -.025em; }
h2 { margin: 0 0 6px; font-size: 20px; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; }
h3 { margin: 18px 0 4px; font-size: 12px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
p { margin: 6px 0; }
a { color: var(--accent); font-weight: 700; text-underline-offset: 3px; }
b, strong { font-weight: 800; }
.card { background: var(--surface); border-radius: var(--radius); padding: 18px; margin: 0 0 14px; box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.card.accent { background: var(--accent-soft); box-shadow: none; }
.card.warn { background: var(--warn-soft); box-shadow: none; }
/* Phases: a coloured spine down the left instead of a stripe across the top */
.card.ph1, .card.ph2, .card.ph3, .card.ph4 { position: relative; padding-left: 24px; overflow: hidden; }
.card.ph1::before, .card.ph2::before, .card.ph3::before, .card.ph4::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--pc); }
.card.ph1 { --pc: var(--p1); } .card.ph2 { --pc: var(--p2); } .card.ph3 { --pc: var(--p3); } .card.ph4 { --pc: var(--p4); }
.card[class*="ph"] > .eyebrow:first-child { color: var(--pc, var(--muted)); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
h3 + .row { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .title { overflow-wrap: anywhere; font-weight: 700; line-height: 1.35; }
.row.done .title { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.chk { position: relative; width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--line-2); background: var(--surface); flex: none; padding: 0; display: grid; place-items: center; color: #fff; transition: transform .15s, background-color .15s, border-color .15s; cursor: pointer; }
.chk::before { content: ""; position: absolute; inset: -8px; }   /* 46px tap target */
.chk.on { background: var(--good); border-color: var(--good); animation: pop .3s; }
.chk.on::after { content: ""; width: 11px; height: 6px; border: solid currentColor; border-width: 0 0 3px 3px; transform: translateY(-1px) rotate(-45deg); }
.ico { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; font-size: 24px; flex: none; background: var(--accent-soft); position: relative; }
.ico.ph1 { background: color-mix(in srgb, var(--p1) 13%, var(--surface)); } .ico.ph2 { background: color-mix(in srgb, var(--p2) 15%, var(--surface)); } .ico.ph3 { background: color-mix(in srgb, var(--p3) 15%, var(--surface)); }
.ico .m { position: absolute; right: -6px; bottom: -6px; font-size: 11px; font-weight: 800; background: var(--good); color: #fff; border-radius: 999px; padding: 1px 6px; border: 2px solid var(--surface); font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 12px; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 4px; vertical-align: 1px; }
.tag.laptop { background: var(--warn-soft); color: var(--warn); }
/* Buttons keep a chunky, pressable edge: the one place the app is deliberately toy-like */
.btn { --edge: var(--accent-dk); font: inherit; font-size: 16px; font-weight: 800; border: 0; border-radius: 14px; padding: 12px 20px; min-height: 46px; background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--edge); transition: transform .06s, box-shadow .06s; cursor: pointer; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--edge); }
.btn.ghost { --edge: var(--line-2); background: var(--surface); color: var(--accent); box-shadow: 0 4px 0 var(--edge), inset 0 0 0 1.5px var(--line-2); }
.btn.go { --edge: var(--good-dk); background: var(--good); color: #fff; }
.btn.danger { --edge: var(--bad-dk); background: var(--bad); color: #fff; }
.btn.big { width: 100%; font-size: 18px; padding: 15px 18px; min-height: 54px; }
.btn.small { padding: 8px 14px; min-height: 38px; font-size: 14px; border-radius: 12px; box-shadow: 0 3px 0 var(--edge); }
.btn.small.ghost { box-shadow: 0 3px 0 var(--edge), inset 0 0 0 1.5px var(--line-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.bar { height: 10px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
.bar > i { display: block; height: 100%; min-width: 10px; background: var(--good); border-radius: 99px; transition: width .4s; }
.bar > i[style*="width:0%"] { min-width: 0; }
.bar.ph1 > i { background: var(--p1); } .bar.ph2 > i { background: var(--p2); } .bar.ph3 > i { background: var(--p3); } .bar.ph4 > i { background: var(--p4); }
.status { font-size: 14px; font-weight: 800; }
.status.ok { color: var(--good); } .status.late { color: var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
.chip { font: inherit; font-size: 15px; font-weight: 700; border: 0; box-shadow: inset 0 0 0 1.5px var(--line-2); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 15px; min-height: 40px; cursor: pointer; }
.chip.on { background: var(--navy); box-shadow: none; color: #fff; }
label { display: block; font-size: 13px; font-weight: 800; color: var(--muted); margin: 14px 0 6px; }
input, select, textarea { font: inherit; font-size: 16px; width: 100%; padding: 12px 14px; border: 1.5px solid var(--line-2); border-radius: 14px; background: var(--surface); color: var(--ink); transition: border-color .15s, box-shadow .15s; }
input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 80%, transparent); }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
input[type="checkbox"] { accent-color: var(--accent); width: 22px !important; height: 22px; padding: 0; }
textarea { min-height: 120px; font-family: ui-monospace, monospace; font-size: 12px; }
.weeks { display: flex; align-items: flex-end; gap: 4px; height: 96px; margin: 12px 0 4px; }
.weeks > div { flex: 1; background: var(--accent); border-radius: 5px 5px 2px 2px; min-height: 3px; }
.weeks > div:last-child { background: var(--flame); }
.weeks > div.zero { background: var(--line); }
.weeklbl { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--muted); }
.stats { display: flex; gap: 12px; }
.stats > div { flex: 1; }
.stats b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.tile { background: var(--surface); border-radius: 20px; padding: 14px 16px; box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.tile b { display: block; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tile span { font-size: 13px; color: var(--muted); font-weight: 700; }
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; margin-top: 10px; }
.badge { text-align: center; font-size: 12px; line-height: 1.25; font-weight: 700; color: var(--muted); }
.badge i { display: grid; place-items: center; width: 58px; height: 58px; margin: 0 auto 6px; border-radius: 50%; font-size: 26px; font-style: normal; background: radial-gradient(circle at 35% 30%, #ffd977, var(--flame) 75%); box-shadow: 0 4px 0 #b84a00, inset 0 -3px 0 rgba(0,0,0,.08); }
.badge.off i { background: var(--sunk); box-shadow: inset 0 0 0 2px var(--line), 0 0 0 transparent; filter: grayscale(1); opacity: .6; }
.badge.on { color: var(--ink); }
.saveerr { background: var(--warn-soft); border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; }
nav.tabs { z-index: 10; position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--surface) 96%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px); box-shadow: 0 -1px 0 var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: flex; padding: 6px 6px 2px; }
nav.tabs button { flex: 1; font: inherit; font-size: 11px; font-weight: 700; border: 0; background: none; color: var(--muted); padding: 0 0 6px; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
nav.tabs button .e { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 999px; transition: background-color .2s; }
nav.tabs button svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button.on { color: var(--accent); font-weight: 800; }
nav.tabs button.on .e { background: var(--accent-soft); }
nav.tabs button.on svg .f { fill: currentColor; fill-opacity: .2; }
#sheet .back { z-index: 20; position: fixed; inset: 0; background: rgba(12,18,34,.5); animation: fade .2s ease-out; }
#sheet .panel { z-index: 21; position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow: auto; background: var(--bg); border-radius: 28px 28px 0 0; padding: 24px 18px calc(env(safe-area-inset-bottom, 0px) + 20px); animation: up .28s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -10px 40px rgba(0,0,0,.18); }
#sheet .panel::before { content: ""; position: absolute; top: 8px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 9px; background: var(--line-2); }
#sheet .panel .in { max-width: 560px; margin: 0 auto; }
table.xl { border-collapse: collapse; margin: 8px 0; font-size: 14px; font-variant-numeric: tabular-nums; }
table.xl td, table.xl th { border: 1px solid var(--line-2); padding: 5px 9px; text-align: left; }
table.xl th { background: var(--sunk); }
.notes { font-size: 16.5px; line-height: 1.6; }
.notes p { margin: 12px 0; }
.choice { display: block; width: 100%; text-align: left; font: inherit; font-size: 16px; font-weight: 700; margin: 10px 0; padding: 14px 16px; min-height: 52px; border-radius: 16px; border: 0; background: var(--surface); color: var(--ink); box-shadow: 0 4px 0 var(--line-2), inset 0 0 0 1.5px var(--line-2); transition: transform .06s, box-shadow .06s; cursor: pointer; }
.choice:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line-2), inset 0 0 0 1.5px var(--line-2); }
.choice.right { background: var(--good-soft); box-shadow: 0 4px 0 var(--good), inset 0 0 0 2px var(--good); color: var(--ink); }
.choice.wrong { background: var(--bad-soft); box-shadow: 0 4px 0 var(--bad), inset 0 0 0 2px var(--bad); animation: shake .35s; }
.choice:disabled { opacity: 1; cursor: default; }
.fb { border-radius: 16px; padding: 14px 16px 14px 18px; margin: 14px 0; font-size: 15px; line-height: 1.5; animation: up .2s ease-out; position: relative; overflow: hidden; }
.fb::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
.fb b:first-child { font-size: 17px; }
.fb.right { background: var(--good-soft); } .fb.right::before { background: var(--good); }
.fb.wrong { background: var(--bad-soft); } .fb.wrong::before { background: var(--bad); }
.qcount { font-size: 14px; color: var(--muted); font-weight: 700; }
.msg { color: var(--good); font-weight: 700; font-size: 14px; }
.err { color: var(--bad); font-weight: 700; font-size: 14px; }
.qtext { font-size: 22px; font-weight: 800; line-height: 1.3; letter-spacing: -.01em; margin: 14px 0; }
.lbar { display: flex; align-items: center; gap: 10px; margin: 6px 0 8px; }
.lbar .bar { flex: 1; margin: 0; height: 12px; }
.lbar .bar > i { background: var(--flame); }
.lbar .x { display: grid; place-items: center; width: 40px; height: 40px; margin-left: -8px; font-size: 20px; font-weight: 800; color: var(--muted); text-decoration: none; line-height: 1; border-radius: 50%; }
.combo { font-weight: 800; color: color-mix(in srgb, var(--flame) 78%, var(--ink)); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
/* Kai the mascot */
.kai { display: block; flex: none; overflow: visible; cursor: pointer; }
.kai .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
.kai.bob { animation: bob 2.6s ease-in-out infinite; }
.kai.jump { animation: jump .6s ease-out; }
.kai.shake { animation: shake .4s; }
.kai .gear { transform-box: fill-box; transform-origin: center; animation: spin 6s linear infinite; }
.hero { display: flex; align-items: flex-end; gap: 8px; margin: -4px 0 14px; }
.bubble { position: relative; flex: 1; background: var(--surface); border-radius: 20px 20px 20px 6px; padding: 12px 16px; font-weight: 700; font-size: 15.5px; line-height: 1.4; margin-bottom: 22px; box-shadow: var(--shadow), inset 0 0 0 1px var(--line); animation: up .25s ease-out; cursor: pointer; }
/* The goal card is a blueprint: navy with a faint grid */
.goalcard { position: relative; background-color: var(--navy); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; background-position: -1px -1px; color: #fff; box-shadow: 0 10px 24px -14px rgba(19,34,74,.7); }
.goalcard > div:first-child b { font-size: 18px; }
.goalcard > div:first-child .small { font-variant-numeric: tabular-nums; }
.goalcard .bar { background: rgba(255,255,255,.14); box-shadow: none; height: 12px; }
.goalcard .bar > i { background: linear-gradient(90deg, var(--sun), var(--flame)); }
.goalcard .btn { --edge: #b84a00; background: var(--kai); color: #2a1300; }
.goalcard .small { color: rgba(255,255,255,.78); }
/* Quick cards: a vertical, swipeable feed */
body.feedon { overflow: hidden; }
body.feedon .wrap { padding-bottom: 0; }
.feed { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 58px); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--navh)); overflow-y: scroll; scroll-snap-type: y mandatory; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.feed::-webkit-scrollbar { display: none; }
.fcard { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; padding: 6px 14px 14px; display: flex; }
.fcard > .fin { --c: var(--p1); flex: 1; max-width: 560px; margin: 0 auto; border-radius: 30px; padding: 20px 20px 16px; display: flex; flex-direction: column; color: #fff; position: relative; overflow: hidden;
  background-color: var(--c); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px), radial-gradient(120% 70% at 100% 0%, rgba(255,255,255,.14), transparent 60%); background-size: 24px 24px, 24px 24px, auto; box-shadow: 0 14px 30px -18px rgba(0,0,0,.55); }
.fcard.ph1 > .fin { --c: #1f4fd1; }
.fcard.ph2 > .fin { --c: #0c7d8b; }
.fcard.ph3 > .fin { --c: #bd4b07; }
.fcard.kaic > .fin { --c: var(--navy); }
.fcard.tip > .fin { --c: #fff4cf; color: #2b1d00; background-image: radial-gradient(rgba(140,95,0,.22) 1.3px, transparent 1.6px), linear-gradient(90deg, transparent 30px, rgba(214,72,72,.3) 30px, rgba(214,72,72,.3) 31.5px, transparent 31.5px); background-size: 20px 20px, auto; background-position: 10px 10px, 0 0; }
.fcard.tip .body { padding-left: 22px; }
.fcard .topic { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; background: rgba(255,255,255,.16); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 800; }
.fcard.tip .topic { background: rgba(160,110,0,.12); box-shadow: none; }
.fcard .qtext { font-size: 25px; line-height: 1.25; margin: 0 0 18px; text-wrap: pretty; }
.fcard .body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding-top: 8px; }
.fcard .body > :first-child { margin-top: auto; }
.fcard .body > :last-child { margin-bottom: auto; }
.fcard .choice { background: #fff; color: #16213b; box-shadow: 0 4px 0 rgba(0,0,0,.22); }
.fcard .choice:active:not(:disabled) { box-shadow: 0 1px 0 rgba(0,0,0,.22); }
.fcard .choice.right { background: #dcf7e6; box-shadow: 0 4px 0 #0b6538, inset 0 0 0 2px #128a4f; }
.fcard .choice.wrong { background: #fde3e7; box-shadow: 0 4px 0 #9c1f33, inset 0 0 0 2px #d4334a; }
.fcard input { background: #fff; color: #16213b; border-color: transparent; font-size: 22px; font-weight: 800; padding: 14px 16px; }
.fcard input::placeholder { color: #7d8396; }
.fcard input:focus { border-color: var(--sun); box-shadow: 0 0 0 4px rgba(255,200,61,.45); }

<script>
(() => {

    return out;
  }

  // XP, daily goal and streak. last = the last day the daily goal was met; streak = days in a row up to then.

  const EMPTY = () => ({ v: 1, ord: "2028-05-01", tasks: seedTasks(), resources: seedResources(), logs: [], weeks: {}, ideas: [], quiz: {}, notes: {}, meal: [0, 0, 0, 0], mealSolved: false, game: GAME0(), savedAt: 0 });

  function validate(o) {
    if (!o || typeof o !== "object") throw new Error("That isn't an ISE Prep export.");
    for (const f of ["tasks", "resources", "logs", "ideas"]) if (!Array.isArray(o[f])) throw new Error(`Missing the "${f}" list.`);
    if (!o.weeks || typeof o.weeks !== "object" || Array.isArray(o.weeks)) throw new Error('Missing the "weeks" section.');

  // ---------- In-app lessons: short notes plus practice questions, all offline ----------

  function mulberry(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const num = (q, ans, explain) => ({ type: "num", q, ans, explain });
  const mc = (q, choices, ans, explain) => ({ type: "mc", q, choices, ans, explain });
  const round = (v, d = 4) => Math.round(v * 10 ** d) / 10 ** d;

  const LESSONS = {
    // ===== Phase 1: calculus =====
    functions: { title: "Functions and graphs", notes: `
<p>A <b>function</b> takes an input x and gives one output f(x). To <b>evaluate</b> f(3), replace every x with 3.</p>
<p><b>Straight lines:</b> y = mx + c. m is the <b>slope</b> (rise over run) and c is where the line crosses the y-axis. The slope through (x₁, y₁) and (x₂, y₂) is (y₂ − y₁) ÷ (x₂ − x₁).</p>
<p><b>Composition:</b> f(g(x)) means do g first, then f. If f(x) = 2x + 1 and g(x) = x², then f(g(3)) = f(9) = 19.</p>
<p><b>Solving:</b> do the same thing to both sides. 3x + 4 = 19 → 3x = 15 → x = 5.</p>
<p class="small muted">Example: f(x) = x² − 3x + 2, so f(4) = 16 − 12 + 2 = 6.</p>`,
      gens: [
        R => { const a = R.int(1, 3), b = R.int(-5, 5), c = R.int(-5, 5), k = R.int(-3, 3); return num(`f(x) = ${poly([[a, 2], [b, 1], [c, 0]])}. What is f(${mi(k)})?`, a * k * k + b * k + c, `Replace x with ${mi(k)}: ${a}(${mi(k)})² ${b < 0 ? "−" : "+"} ${Math.abs(b)}(${mi(k)}) ${c < 0 ? "−" : "+"} ${Math.abs(c)} = ${a * k * k + b * k + c}.`); },
        R => { const m = R.nz(-4, 4), x1 = R.int(-3, 3), dx = R.int(1, 4), y1 = R.int(-5, 5); return num(`What is the slope of the line through (${mi(x1)}, ${mi(y1)}) and (${mi(x1 + dx)}, ${mi(y1 + m * dx)})?`, m, `Rise ÷ run = (${mi(y1 + m * dx)} − ${mi(y1)}) ÷ (${mi(x1 + dx)} − ${mi(x1)}) = ${m * dx} ÷ ${dx} = ${m}.`); },
        R => { const a = R.int(2, 4), b = R.int(-5, 5), k = R.int(-3, 3); return num(`f(x) = ${poly([[a, 1], [b, 0]])} and g(x) = x². What is f(g(${mi(k)}))?`, a * k * k + b, `g(${mi(k)}) = ${k * k}, then f(${k * k}) = ${a}×${k * k} ${b < 0 ? "−" : "+"} ${Math.abs(b)} = ${a * k * k + b}.`); },
        R => { const x = R.int(-6, 6), a = R.int(2, 5), b = R.int(-9, 9); return num(`Solve ${poly([[a, 1], [b, 0]])} = ${mi(a * x + b)}. What is x?`, x, `Subtract ${mi(b)} from both sides: ${a}x = ${mi(a * x)}. Divide by ${a}: x = ${x}.`); },
        R => { const m = R.nz(-3, 4), c = R.nz(-5, 5), k = R.pick([2, 3]); return num(`The line ${k}y = ${poly([[k * m, 1], [k * c, 0]])}. Where does it cross the y-axis (the value of c)?`, c, `Divide everything by ${k}: y = ${poly([[m, 1], [c, 0]])}, so c = ${c}.`); },
      ] },
    explog: { title: "Exponentials and logarithms", notes: `
<p><b>Index laws:</b> a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup>, (a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup>, a<sup>0</sup> = 1, a<sup>−n</sup> = 1/a<sup>n</sup>.</p>
<p>A <b>logarithm</b> answers "what power?": log₂ 8 = 3 because 2³ = 8. log₁₀ 1000 = 3.</p>
<p><b>Log laws:</b> log(ab) = log a + log b, log(a/b) = log a − log b, log(a<sup>n</sup>) = n log a.</p>
<p><b>e and ln:</b> e ≈ 2.718 and ln means log base e. ln(e<sup>k</sup>) = k and e<sup>ln k</sup> = k. They undo each other.</p>
<p class="small muted">Example: solve 2<sup>x</sup> = 32. Since 32 = 2⁵, x = 5.</p>`,
      gens: [
        R => { const a = R.int(2, 9), b = R.int(2, 9); return num(`2<sup>${a}</sup> × 2<sup>${b}</sup> = 2<sup>?</sup>`, a + b, `Same base, so add the powers: ${a} + ${b} = ${a + b}.`); },
        R => { const a = R.int(2, 5), b = R.int(2, 4); return num(`(3<sup>${a}</sup>)<sup>${b}</sup> = 3<sup>?</sup>`, a * b, `A power of a power multiplies: ${a} × ${b} = ${a * b}.`); },
        R => { const k = R.int(2, 8); return num(`log₂ ${2 ** k} = ?`, k, `2<sup>${k}</sup> = ${2 ** k}, so the answer is ${k}.`); },
        R => { const [b, k] = R.pick([[2, R.int(3, 7)], [3, R.int(2, 5)], [5, R.int(2, 4)]]); return num(`Solve ${b}<sup>x</sup> = ${b ** k}.`, k, `${b ** k} = ${b}<sup>${k}</sup>, so x = ${k}.`); },
        R => { const k = R.int(2, 9); return num(`ln(e<sup>${k}</sup>) = ?`, k, `ln and e undo each other, so it's ${k}.`); },
        R => { const a = R.int(1, 4), b = R.int(1, 4); return num(`log₂ ${2 ** a} + log₂ ${2 ** b} = ?`, a + b, `log₂ ${2 ** a} = ${a} and log₂ ${2 ** b} = ${b}, so ${a + b}. (Or: log₂ ${2 ** (a + b)}.)`); },
      ] },
    limits: { title: "Limits: the idea", notes: `
<p>A <b>limit</b> asks what value f(x) gets close to as x gets close to some number. It doesn't care what happens exactly at that number.</p>
<p><b>Usually you just substitute:</b> the limit of x² + 1 as x → 2 is 5.</p>
<p><b>If substituting gives 0/0, simplify first:</b> (x² − 9)/(x − 3) = (x − 3)(x + 3)/(x − 3) = x + 3, so the limit as x → 3 is 6.</p>
<p><b>As x → ∞:</b> c/x → 0. For (ax + 1)/(bx + 2), divide top and bottom by x, and the limit is a/b.</p>
<p>Why it matters: the derivative is defined as a limit, the slope between two points as they get closer together.</p>`,
      gens: [
        R => { const k = R.int(-3, 4), b = R.int(-4, 4); return num(`What is the limit of ${poly([[1, 2], [b, 1]])} as x → ${mi(k)}?`, k * k + b * k, `No problem at x = ${mi(k)}, so substitute: ${k * k + b * k}.`); },
        R => { const a = R.int(1, 6); return num(`What is the limit of (x² − ${a * a}) / (x − ${a}) as x → ${a}?`, 2 * a, `Factor: (x − ${a})(x + ${a}) / (x − ${a}) = x + ${a}. At x = ${a} that's ${2 * a}.`); },
        R => { const c = R.int(2, 50); return num(`What is the limit of ${c}/x as x → ∞?`, 0, `Dividing ${c} by a bigger and bigger number gets closer and closer to 0.`); },
        R => { const a = R.int(1, 6), b = R.int(2, 6); return num(`What is the limit of (${a}x + 1) / (${b}x + 2) as x → ∞? (A fraction is fine.)`, a / b, `For huge x, the +1 and +2 hardly matter, so it tends to ${a}/${b} = ${frac(a, b)}.`); },
        () => mc("What does a limit describe?", ["The value f(x) approaches as x gets close to a number", "The largest value f(x) can take", "The value of f(x) at exactly that number, always", "Where the graph crosses the x-axis"], 0, "A limit is about the value being approached, even if f isn't defined right at that point."),
      ] },
    power: { title: "Derivatives and the power rule", notes: `
<p>The <b>derivative</b> f′(x) is the slope of the graph at x: how fast f is changing.</p>
<p><b>Power rule:</b> the derivative of x<sup>n</sup> is n·x<sup>n−1</sup>. Bring the power down, then reduce it by one.</p>
<p>Constants multiply through: the derivative of 5x³ is 15x². The derivative of a constant is 0, and of bx it's b. Differentiate a sum term by term.</p>
<p class="small muted">Example: f(x) = 3x⁴ − 2x + 5, so f′(x) = 12x³ − 2 and f′(1) = 10.</p>
<p class="small muted">Questions ask for f′ at a point, so your answer is a number.</p>`,
      gens: [
        R => { const a = R.int(1, 5), n = R.int(2, 5), b = R.int(-6, 6), c = R.int(-5, 5), k = R.int(-2, 2); const ans = a * n * k ** (n - 1) + b; return num(`f(x) = ${poly([[a, n], [b, 1], [c, 0]])}. What is f′(${mi(k)})?`, ans, `f′(x) = ${poly([[a * n, n - 1], [b, 0]])}. At x = ${mi(k)}: ${ans}.`); },
        R => { const n = R.int(2, 5), k = R.int(1, 3); return num(`What is the slope of y = x<sup>${n}</sup> at x = ${k}?`, n * k ** (n - 1), `dy/dx = ${n}x<sup>${n - 1}</sup>, so at x = ${k} it's ${n}×${k ** (n - 1)} = ${n * k ** (n - 1)}.`); },
        R => { const a = R.int(2, 6), b = R.int(-9, 9), c = R.int(-9, 9), k = R.int(-3, 3); return num(`f(x) = ${poly([[a, 2], [b, 1], [c, 0]])}. What is f′(${mi(k)})?`, 2 * a * k + b, `f′(x) = ${poly([[2 * a, 1], [b, 0]])}, so f′(${mi(k)}) = ${2 * a * k + b}.`); },
        R => { const c = R.int(2, 99); return num(`f(x) = ${c}. What is f′(x)?`, 0, "A constant doesn't change, so its slope is 0."); },
      ] },
    product: { title: "Product and quotient rules", notes: `
<p><b>Product rule:</b> if f = u·v, then f′ = u′v + uv′.</p>
<p><b>Quotient rule:</b> if f = u/v, then f′ = (u′v − uv′) / v².</p>
<p class="small muted">Example (product): f = x²(x + 3). u = x², u′ = 2x, v = x + 3, v′ = 1. f′ = 2x(x + 3) + x². At x = 1: 8 + 1 = 9.</p>
<p class="small muted">Example (quotient): f = x/(x + 2). f′ = (1·(x + 2) − x·1)/(x + 2)² = 2/(x + 2)². At x = 0: 2/4 = 1/2.</p>
<p class="small muted">Fractions like 3/8 or decimals like 0.375 are both accepted.</p>`,
      gens: [
        R => { const a = R.int(1, 3), b = R.int(-3, 4), c = R.int(1, 3), d = R.int(-3, 4), k = R.int(0, 2); const ans = a * (c * k + d) + c * (a * k + b); return num(`f(x) = (${poly([[a, 1], [b, 0]])})(${poly([[c, 1], [d, 0]])}). What is f′(${k})?`, ans, `u′v + uv′ = ${a}(${poly([[c, 1], [d, 0]])}) + ${c}(${poly([[a, 1], [b, 0]])}). At x = ${k}: ${a}×${c * k + d} + ${c}×${a * k + b} = ${ans}.`); },
        R => { const m = R.int(2, 3), c = R.int(1, 5), k = R.int(1, 2); const ans = m * k ** (m - 1) * (k + c) + k ** m; return num(`f(x) = x<sup>${m}</sup>(x + ${c}). What is f′(${k})?`, ans, `u = x<sup>${m}</sup>, v = x + ${c}. f′ = ${m}x<sup>${m - 1}</sup>(x + ${c}) + x<sup>${m}</sup>. At x = ${k}: ${m * k ** (m - 1) * (k + c)} + ${k ** m} = ${ans}.`); },
        R => { const c = R.int(1, 5), k = R.int(0, 3); return num(`f(x) = x / (x + ${c}). What is f′(${k})?`, c / (k + c) ** 2, `f′ = (1·(x + ${c}) − x·1)/(x + ${c})² = ${c}/(x + ${c})². At x = ${k}: ${frac(c, (k + c) ** 2)}.`); },
        R => { const k = R.int(1, 3); return num(`f(x) = x² / (x + 1). What is f′(${k})?`, (k * k + 2 * k) / (k + 1) ** 2, `f′ = (2x(x + 1) − x²)/(x + 1)² = (x² + 2x)/(x + 1)². At x = ${k}: ${frac(k * k + 2 * k, (k + 1) ** 2)}.`); },
      ] },
    chain: { title: "Chain rule", notes: `
<p>For a function inside a function, f(g(x)): <b>differentiate the outside, keep the inside, then multiply by the derivative of the inside.</b></p>
<p>d/dx f(g(x)) = f′(g(x)) · g′(x)</p>
<p class="small muted">Example: (3x + 1)⁴. Outside: u⁴ → 4u³. Inside: 3x + 1 → 3. So the derivative is 4(3x + 1)³ × 3 = 12(3x + 1)³. At x = 0: 12.</p>
<p class="small muted">√(ax + b) = (ax + b)<sup>1/2</sup>, so its derivative is a / (2√(ax + b)).</p>`,
      gens: [
        R => { const a = R.int(2, 3), b = R.int(-3, 3), n = R.int(2, 4), k = R.int(0, 2); const ans = n * a * (a * k + b) ** (n - 1); return num(`f(x) = (${poly([[a, 1], [b, 0]])})<sup>${n}</sup>. What is f′(${k})?`, ans, `f′ = ${n}(${poly([[a, 1], [b, 0]])})<sup>${n - 1}</sup> × ${a}. At x = ${k}: ${n}×${mi(a * k + b)}<sup>${n - 1}</sup>×${a} = ${ans}.`); },
        R => { const s = R.int(2, 5), a = R.int(1, 4), k = R.int(0, 3), b = s * s - a * k; return num(`f(x) = √(${poly([[a, 1], [b, 0]])}). What is f′(${k})? (A fraction is fine.)`, a / (2 * s), `f′ = ${a} / (2√(${poly([[a, 1], [b, 0]])})). At x = ${k}, the root is √${s * s} = ${s}, so ${frac(a, 2 * s)}.`); },
        R => { const n = R.int(2, 5), k = R.int(1, 2); return num(`f(x) = (x² + 1)<sup>${n}</sup>. What is f′(${k})?`, n * (k * k + 1) ** (n - 1) * 2 * k, `f′ = ${n}(x² + 1)<sup>${n - 1}</sup> × 2x. At x = ${k}: ${n}×${k * k + 1}<sup>${n - 1}</sup>×${2 * k} = ${n * (k * k + 1) ** (n - 1) * 2 * k}.`); },
      ] },
    special: { title: "Derivatives of eˣ, ln x, sin and cos", notes: `
<p>Learn these four by heart:</p>
<p>d/dx eˣ = eˣ &nbsp;·&nbsp; d/dx ln x = 1/x &nbsp;·&nbsp; d/dx sin x = cos x &nbsp;·&nbsp; d/dx cos x = −sin x</p>
<p>With the chain rule: d/dx e<sup>kx</sup> = k·e<sup>kx</sup> and d/dx sin(kx) = k·cos(kx).</p>
<p>Handy values: e⁰ = 1, sin 0 = 0, cos 0 = 1.</p>
<p class="small muted">Example: f = 4e<sup>2x</sup>, so f′ = 8e<sup>2x</sup> and f′(0) = 8. Trap: d/dx ln(5x) = 5/(5x) = 1/x.</p>`,
      gens: [
        R => { const a = R.int(1, 5), b = R.int(2, 4); return num(`f(x) = ${a === 1 ? "" : a}e<sup>${b}x</sup>. What is f′(0)?`, a * b, `f′ = ${a * b}e<sup>${b}x</sup>, and e⁰ = 1, so ${a * b}.`); },
        R => { const a = R.int(1, 6), k = R.int(1, 4); return num(`f(x) = ${a === 1 ? "" : a} ln x. What is f′(${k})? (A fraction is fine.)`, a / k, `f′ = ${a}/x, so ${frac(a, k)}.`); },
        R => { const a = R.int(2, 6); return num(`f(x) = sin(${a}x). What is f′(0)?`, a, `f′ = ${a}cos(${a}x), and cos 0 = 1, so ${a}.`); },
        R => { const a = R.int(2, 6); return num(`f(x) = ${a} cos x. What is f′(0)?`, 0, `f′ = −${a} sin x, and sin 0 = 0, so 0.`); },
        R => { const a = R.int(2, 9), k = R.int(1, 4); return num(`f(x) = ln(${a}x). What is f′(${k})? (A fraction is fine.)`, 1 / k, `ln(${a}x) = ln ${a} + ln x, so f′ = 1/x = ${frac(1, k)}. The ${a} disappears.`); },
        () => num("f(x) = x·eˣ. What is f′(0)?", 1, "Product rule: eˣ + x·eˣ. At 0: 1 + 0 = 1."),
      ] },
    maxmin: { title: "Maxima and minima", notes: `
<p>At a maximum or minimum, the graph is flat, so <b>f′(x) = 0</b>. Solve f′(x) = 0 to find these <b>turning points</b>.</p>
<p>To tell which is which, check the second derivative: f″ &gt; 0 means a minimum (a valley), f″ &lt; 0 means a maximum (a hill).</p>
<p><b>This is optimisation, the heart of ISE:</b> lowest cost, highest profit, shortest time.</p>
<p class="small muted">Example: cost C(q) = q² − 20q + 150. C′ = 2q − 20 = 0 gives q = 10, and C″ = 2 &gt; 0, so the minimum cost is C(10) = 50.</p>`,
      gens: [
        R => { const a = R.int(1, 3), h = R.int(-5, 5), c = R.int(-5, 9); return num(`f(x) = ${poly([[a, 2], [-2 * a * h, 1], [c, 0]])}. At which x is f smallest?`, h, `f′ = ${poly([[2 * a, 1], [-2 * a * h, 0]])} = 0 gives x = ${h}.`); },
        R => { const h = R.int(5, 40), m = R.int(10, 200); return num(`Making q units costs C(q) = q² − ${2 * h}q + ${h * h + m} dollars. What is the lowest possible cost?`, m, `C′ = 2q − ${2 * h} = 0 gives q = ${h}. C(${h}) = ${h * h} − ${2 * h * h} + ${h * h + m} = ${m}.`); },
        R => { const k = R.int(1, 4); return num(`f(x) = x³ − ${3 * k * k}x. At which x does it have a local maximum?`, -k, `f′ = 3x² − ${3 * k * k} = 0 gives x = ±${k}. f″ = 6x is negative at x = −${k}, so the maximum is there.`); },
        R => { const P = 4 * R.int(3, 25); return num(`A rectangle has perimeter ${P} m. What is the largest area it can have, in m²?`, (P / 4) ** 2, `With sides x and ${P / 2} − x, area A = x(${P / 2} − x). A′ = ${P / 2} − 2x = 0 gives x = ${P / 4}: a square, area ${(P / 4) ** 2}.`); },
        () => mc("At a maximum or minimum of a smooth curve, the derivative is…", ["Zero", "Positive", "Negative", "Undefined"], 0, "The tangent is flat at a turning point, so the slope is 0."),
      ] },
    antideriv: { title: "Antiderivatives", notes: `
<p><b>Integration undoes differentiation.</b> An antiderivative of f is a function F with F′ = f.</p>
<p><b>Reverse power rule:</b> ∫ xⁿ dx = xⁿ⁺¹/(n + 1) + C (for n ≠ −1). Raise the power by one, then divide by the new power.</p>
<p>The <b>+ C</b> is there because constants vanish when you differentiate, so every antiderivative has an unknown constant. A starting value such as F(0) = 3 pins it down.</p>
<p class="small muted">Example: ∫ 6x² dx = 2x³ + C. If F(0) = 1, then C = 1 and F(1) = 3.</p>`,
      gens: [
        R => { const n = R.int(1, 4), m = R.int(1, 5); return num(`∫ ${(n + 1) * m}x<sup>${n}</sup> dx = k·x<sup>${n + 1}</sup> + C. What is k?`, m, `Raise the power to ${n + 1} and divide by it: ${(n + 1) * m}/${n + 1} = ${m}.`); },
        R => { const n = R.int(1, 3), m = R.int(1, 4), c = R.int(-5, 5); return num(`F′(x) = ${(n + 1) * m}x<sup>${n}</sup> and F(0) = ${mi(c)}. What is F(1)?`, m + c, `F(x) = ${m === 1 ? "" : m}x<sup>${n + 1}</sup> + C, and F(0) = C = ${mi(c)}. So F(1) = ${m} ${c < 0 ? "−" : "+"} ${Math.abs(c)} = ${m + c}.`); },
        () => mc("Why do we add + C to an antiderivative?", ["Constants disappear when you differentiate, so any constant could have been there", "It stands for the area under the curve", "To make the answer positive", "It's only needed for e and ln"], 0, "x² + 5 and x² − 1 both have derivative 2x, so you can't tell the constant from the derivative alone."),
      ] },
    definite: { title: "Definite integrals", notes: `
<p>∫ from a to b of f(x) dx = F(b) − F(a), where F is any antiderivative. The + C cancels.</p>
<p>It measures the (signed) <b>area under the curve</b> between x = a and x = b. In ISE it's used for totals: total demand over time, or probabilities from a distribution.</p>
<p class="small muted">Example: ∫₁² 3x² dx = [x³]₁² = 8 − 1 = 7.</p>`,
      gens: [
        R => { const a = R.int(1, 3), b = R.int(1, 4), c = R.int(0, 5); return num(`Work out ∫₀<sup>${b}</sup> (${poly([[2 * a, 1], [c, 0]])}) dx.`, a * b * b + c * b, `Antiderivative: ${poly([[a, 2], [c, 1]])}. At ${b}: ${a * b * b + c * b}; at 0: 0. Answer ${a * b * b + c * b}.`); },
        R => { const b = R.int(1, 4); return num(`Work out ∫₀<sup>${b}</sup> 3x² dx.`, b ** 3, `[x³] from 0 to ${b} = ${b ** 3}.`); },
        R => { const k = R.int(2, 9), a = R.int(0, 3), b = a + R.int(1, 5); return num(`Work out ∫<sub>${a}</sub><sup>${b}</sup> ${k} dx.`, k * (b - a), `A rectangle: height ${k} × width ${b - a} = ${k * (b - a)}.`); },
        R => { const b = R.pick([1, 2, 3]); return num(`Work out ∫₀<sup>${b}</sup> 4x³ dx.`, b ** 4, `[x⁴] from 0 to ${b} = ${b ** 4}.`); },
      ] },
    subst: { title: "Integration by substitution", notes: `
<p>Substitution is the chain rule in reverse. Look for a function and its derivative both inside the integral.</p>
<p>Steps: pick u = the inside function, find du = u′ dx, rewrite everything in u, integrate, then change back (or change the limits).</p>
<p class="small muted">Example: ∫₀¹ 2x(x² + 1)³ dx. Let u = x² + 1, du = 2x dx. The limits become u = 1 to 2. ∫₁² u³ du = [u⁴/4]₁² = 4 − 1/4 = 15/4.</p>`,
      gens: [
        R => { const n = R.int(1, 3); return num(`Work out ∫₀¹ 2x(x² + 1)<sup>${n}</sup> dx. (A fraction is fine.)`, (2 ** (n + 1) - 1) / (n + 1), `u = x² + 1, du = 2x dx, u goes from 1 to 2. ∫₁² u<sup>${n}</sup> du = (2<sup>${n + 1}</sup> − 1)/${n + 1} = ${frac(2 ** (n + 1) - 1, n + 1)}.`); },
        R => { const n = R.int(1, 3); return num(`Work out ∫₀¹ 3x²(x³ + 1)<sup>${n}</sup> dx. (A fraction is fine.)`, (2 ** (n + 1) - 1) / (n + 1), `u = x³ + 1, du = 3x² dx, u goes from 1 to 2. Same as ∫₁² u<sup>${n}</sup> du = ${frac(2 ** (n + 1) - 1, n + 1)}.`); },
        R => { const a = R.int(1, 2); return num(`Work out ∫₀¹ ${a === 1 ? "" : a}e<sup>${a === 1 ? "" : a}x</sup> dx, to 2 decimal places.`, Math.E ** a - 1, `u = ${a}x gives [e<sup>${a}x</sup>]₀¹ = e<sup>${a}</sup> − 1 ≈ ${(Math.E ** a - 1).toFixed(2)}.`); },
        () => mc("For ∫ 2x·cos(x²) dx, the best substitution is u = …", ["x²", "2x", "cos(x²)", "cos x"], 0, "x² is the inside function, and its derivative 2x is right there."),
      ] },
    check1: { title: "Checkpoint: calculus", mix: ["power", "product", "chain", "special", "maxmin", "definite", "subst"], count: 8, notes: `
<p>Eight mixed questions from the whole phase, plus the interview questions you couldn't do in November. Score 80% or more to pass the checkpoint.</p>
<p class="small muted">Then try Khan Academy's Calculus 1 course challenge after ORD for a second opinion.</p>`,
      fixed: [
        () => num("Interview Q1: differentiate y = x³ − 4x + 2 and give dy/dx at x = 2.", 8, "dy/dx = 3x² − 4. At x = 2: 12 − 4 = 8."),
        () => num("Interview Q2: y = x·e<sup>2x</sup>. What is dy/dx at x = 0?", 1, "Product rule: e<sup>2x</sup> + 2x·e<sup>2x</sup> = e<sup>2x</sup>(1 + 2x). At 0: 1."),
        () => num("Interview Q3: work out ∫₀² (2x + 3) dx.", 10, "[x² + 3x]₀² = 4 + 6 = 10."),
      ] },

    // ===== Phase 2: statistics and matrices =====
    describe: { title: "Mean, median and quartiles", notes: `
<p><b>Mean:</b> add everything up and divide by how many there are. <b>Median:</b> the middle value once sorted (with an even count, the average of the middle two). <b>Mode:</b> the most common value. <b>Range:</b> largest minus smallest.</p>
<p><b>Quartiles</b> split sorted data into four quarters. Q1 is the 25th percentile and Q3 the 75th. The <b>interquartile range</b> (IQR) = Q3 − Q1 is the spread of the middle half.</p>
<p>Use the <b>median</b> when outliers would drag the mean, like salaries or HDB prices.</p>`,
      gens: [
        R => { const xs = Array.from({ length: 7 }, () => R.int(1, 20)); const s = xs.reduce((a, b) => a + b, 0); return num(`Find the mean of ${xs.join(", ")}. (Up to 2 decimal places.)`, s / 7, `Sum = ${s}, divided by 7 = ${round(s / 7, 2)}.`); },
        R => { const xs = Array.from({ length: 7 }, () => R.int(1, 30)); const s = [...xs].sort((a, b) => a - b); return num(`Find the median of ${xs.join(", ")}.`, s[3], `Sorted: ${s.join(", ")}. The middle (4th) value is ${s[3]}.`); },
        R => { const xs = Array.from({ length: 6 }, () => R.int(1, 30)); const s = [...xs].sort((a, b) => a - b); return num(`Find the median of ${xs.join(", ")}.`, (s[2] + s[3]) / 2, `Sorted: ${s.join(", ")}. Even count, so average the 3rd and 4th: (${s[2]} + ${s[3]}) / 2 = ${(s[2] + s[3]) / 2}.`); },
        R => { const xs = Array.from({ length: 6 }, () => R.int(2, 40)); const s = [...xs].sort((a, b) => a - b); return num(`Find the range of ${xs.join(", ")}.`, s[5] - s[0], `${s[5]} − ${s[0]} = ${s[5] - s[0]}.`); },
        R => { const q1 = R.int(10, 40), q3 = q1 + R.int(5, 30); return num(`Q1 = ${q1} and Q3 = ${q3}. What is the interquartile range?`, q3 - q1, `IQR = Q3 − Q1 = ${q3 - q1}.`); },
        () => mc("Five people earn $3,000 a month and one earns $100,000. Which is the better 'typical' salary?", ["The median", "The mean", "The range", "The mode is always best"], 0, "The one huge salary drags the mean up. The median ($3,000) stays typical."),
      ] },
    spread: { title: "Standard deviation and box plots", notes: `
<p><b>Standard deviation</b> (SD) measures how far values typically are from the mean. To compute it: find each value's distance from the mean, square those, average them (that's the <b>variance</b>), then take the square root.</p>
<p>Adding a constant to every value doesn't change the SD. Multiplying every value by k multiplies the SD by k.</p>
<p>A <b>box plot</b> shows the minimum, Q1, median, Q3 and maximum. The box spans Q1 to Q3 (the IQR).</p>
<p class="small muted">Example: 2, 4, 4, 4, 5, 5, 7, 9 has mean 5, variance 4 and SD 2.</p>`,
      gens: [
        R => { const sh = R.int(1, 20); const xs = [2, 4, 4, 4, 5, 5, 7, 9].map(v => v + sh); return num(`Find the (population) SD of ${xs.join(", ")}.`, 2, `It's 2, 4, 4, 4, 5, 5, 7, 9 with ${sh} added to each, and adding a constant doesn't change the spread. SD = 2.`); },
        R => { const m = R.int(2, 5); const xs = [2, 4, 4, 4, 5, 5, 7, 9].map(v => v * m); return num(`Find the (population) SD of ${xs.join(", ")}.`, 2 * m, `It's 2, 4, 4, 4, 5, 5, 7, 9 (SD 2) multiplied by ${m}, so SD = ${2 * m}.`); },
        R => { const sd = R.int(2, 9); return num(`The SD of some data is ${sd}. What is the variance?`, sd * sd, `Variance = SD² = ${sd * sd}.`); },
        () => mc("In a box plot, the box itself spans…", ["Q1 to Q3", "The minimum to the maximum", "The mean ± 1 SD", "The median to the maximum"], 0, "The box is the middle half of the data, Q1 to Q3."),
        () => mc("Every value in a dataset is increased by 10. The standard deviation…", ["Stays the same", "Increases by 10", "Doubles", "Becomes 0"], 0, "Shifting everything moves the mean too, so distances from the mean are unchanged."),
      ] },
    counting: { title: "Counting and basic probability", notes: `
<p>For equally likely outcomes: <b>P(event) = favourable outcomes ÷ total outcomes</b>.</p>
<p>Two dice have 6 × 6 = 36 outcomes. n distinct things can be ordered in <b>n!</b> ways (4! = 24).</p>
<p><b>Combinations</b>, "choose r from n" when order doesn't matter: C(n, r) = n! / (r!(n − r)!). For example, C(5, 2) = 10.</p>
<p><b>"At least one" trick:</b> P(at least one) = 1 − P(none).</p>`,
      gens: [
        R => { const s = R.int(2, 12); let c = 0; for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) if (a + b === s) c++; return num(`Two fair dice are rolled. What is the probability that the total is ${s}? (A fraction is fine.)`, c / 36, `${c} of the 36 outcomes give ${s}, so ${frac(c, 36)}.`); },
        R => { const n = R.int(2, 5); return num(`A fair coin is flipped ${n} times. What is the probability of at least one head? (A fraction is fine.)`, 1 - 1 / 2 ** n, `P(no heads) = 1/${2 ** n}, so P(at least one) = 1 − 1/${2 ** n} = ${frac(2 ** n - 1, 2 ** n)}.`); },
        R => { const n = R.int(3, 6); return num(`In how many orders can ${n} different books go on a shelf?`, fact(n), `${n}! = ${fact(n)}.`); },
        R => { const n = R.int(4, 10), r = R.int(2, 3); return num(`How many ways can you choose ${r} people from ${n}, if order doesn't matter?`, C(n, r), `C(${n}, ${r}) = ${C(n, r)}.`); },
        R => { const r = R.int(1, 9), b = R.int(1, 9); return num(`A bag has ${r} red and ${b} blue balls. One is picked at random. What is P(red)? (A fraction is fine.)`, r / (r + b), `${r} out of ${r + b} = ${frac(r, r + b)}.`); },
      ] },
    conditional: { title: "Combining events and conditional probability", notes: `
<p><b>Independent events</b> (one doesn't affect the other): P(A and B) = P(A) × P(B).</p>
<p><b>Or:</b> P(A or B) = P(A) + P(B) − P(A and B). The subtraction stops you counting the overlap twice.</p>
<p><b>Not:</b> P(not A) = 1 − P(A).</p>
<p><b>Conditional:</b> P(A | B), "A given B", = P(A and B) / P(B). With a table of counts, restrict to the B row or column, then divide.</p>
<p class="small muted">Example: machine Y made 40 parts, and 6 were defective. P(defective | Y) = 6/40 = 0.15.</p>`,
      gens: [
        R => { const p = R.int(1, 9) / 10, q = R.int(1, 9) / 10; return num(`A and B are independent, with P(A) = ${p} and P(B) = ${q}. What is P(A and B)?`, p * q, `${p} × ${q} = ${round(p * q)}.`); },
        R => { const p = R.int(1, 9) / 10, q = R.int(1, 9) / 10; return num(`A and B are independent, with P(A) = ${p} and P(B) = ${q}. What is P(A or B)?`, p + q - p * q, `${p} + ${q} − ${p}×${q} = ${round(p + q - p * q)}.`); },
        R => { const g1 = R.int(20, 60), d1 = R.int(1, 10), g2 = R.int(20, 60), d2 = R.int(1, 10); return num(`Machine X made ${g1} good and ${d1} defective parts. Machine Y made ${g2} good and ${d2} defective. A part from Y is picked. What is P(defective)? (A fraction is fine.)`, d2 / (g2 + d2), `Only look at Y: ${d2} defective out of ${g2 + d2} = ${frac(d2, g2 + d2)}.`); },
        R => { const g1 = R.int(20, 60), d1 = R.int(1, 10), g2 = R.int(20, 60), d2 = R.int(1, 10); return num(`Machine X made ${g1} good and ${d1} defective parts. Machine Y made ${g2} good and ${d2} defective. A defective part is picked. What is P(it came from Y)? (A fraction is fine.)`, d2 / (d1 + d2), `Only look at defective parts: ${d2} of ${d1 + d2} came from Y, so ${frac(d2, d1 + d2)}.`); },
        R => { const p = R.int(1, 99) / 100; return num(`P(rain) = ${p}. What is P(no rain)?`, 1 - p, `1 − ${p} = ${round(1 - p, 2)}.`); },
      ] },
    normal: { title: "The normal distribution", notes: `
<p>The <b>normal distribution</b> is the bell curve: symmetric around the mean μ, with its spread set by the SD σ.</p>
<p><b>68–95–99.7 rule:</b> about 68% of values lie within 1σ of the mean, 95% within 2σ, and 99.7% within 3σ.</p>
<p>A <b>z-score</b> says how many SDs a value is from the mean: z = (x − μ) / σ.</p>
<p class="small muted">Example: IPPT 2.4 km times with mean 12 min and SD 1 min. About 95% of runners take between 10 and 14 minutes.</p>`,
      gens: [
        R => { const mu = R.int(50, 100), s = R.int(2, 10), k = R.pick([1, 2, 3]); return num(`Data are normal with mean ${mu} and SD ${s}. Roughly what percentage lies between ${mu - k * s} and ${mu + k * s}?`, [68, 95, 99.7][k - 1], `That's within ${k} SD of the mean: about ${[68, 95, 99.7][k - 1]}%.`); },
        R => { const mu = R.int(50, 100), s = R.int(2, 10); return num(`Data are normal with mean ${mu} and SD ${s}. Roughly what percentage is above ${mu + 2 * s}?`, 2.5, `95% is within 2 SD, so 5% is outside, split equally between the two tails: 2.5%.`); },
        R => { const mu = R.int(40, 90), s = R.int(2, 10), z = R.pick([-2, -1, 1, 2, 3]); return num(`Mean ${mu}, SD ${s}. What is the z-score of ${mu + z * s}?`, z, `(${mu + z * s} − ${mu}) / ${s} = ${z}.`); },
        () => mc("Which is true of a normal distribution?", ["Mean, median and mode are equal", "It is skewed to the right", "Half the data lies within 1 SD of the mean", "It can't have negative values"], 0, "It's symmetric, so its centre is the mean, the median and the mode."),
      ] },
    binomial: { title: "The binomial distribution", notes: `
<p>Use the <b>binomial distribution</b> when you repeat n independent trials, each with the same chance p of "success", and count the successes X.</p>
<p>P(X = k) = C(n, k) · p<sup>k</sup> · (1 − p)<sup>n−k</sup></p>
<p><b>Mean</b> = np. <b>Variance</b> = np(1 − p).</p>
<p class="small muted">Example: 10% of parts are faulty and you check 3. P(none faulty) = 0.9³ = 0.729.</p>`,
      gens: [
        R => { const n = R.int(3, 6), k = R.int(0, n); return num(`A fair coin is flipped ${n} times. What is P(exactly ${k} heads)? (A fraction is fine.)`, C(n, k) / 2 ** n, `C(${n}, ${k}) / 2<sup>${n}</sup> = ${C(n, k)}/${2 ** n} = ${frac(C(n, k), 2 ** n)}.`); },
        R => { const n = R.pick([10, 20, 40, 50]), p = R.pick([0.1, 0.2, 0.3, 0.5]); return num(`X is binomial with n = ${n} and p = ${p}. What is the mean?`, n * p, `np = ${n} × ${p} = ${round(n * p)}.`); },
        R => { const n = R.pick([10, 20, 50, 100]), p = R.pick([0.1, 0.2, 0.5]); return num(`X is binomial with n = ${n} and p = ${p}. What is the variance?`, n * p * (1 - p), `np(1 − p) = ${n} × ${p} × ${round(1 - p)} = ${round(n * p * (1 - p))}.`); },
        R => { const n = R.int(2, 4), p = R.pick([0.1, 0.2]); return num(`${Math.round(p * 100)}% of parts are faulty. You check ${n} at random. What is P(none faulty)? (Up to 4 decimal places.)`, (1 - p) ** n, `${round(1 - p)}<sup>${n}</sup> = ${round((1 - p) ** n)}.`); },
      ] },
    sampling: { title: "Sampling: the idea", notes: `
<p>We usually can't measure everyone (the <b>population</b>), so we measure a <b>sample</b> and use it to estimate.</p>
<p><b>Random sampling</b> avoids bias. Asking only your own section about cookhouse food doesn't represent the whole camp.</p>
<p>Bigger samples give steadier estimates. The <b>standard error</b> of a sample mean is σ / √n, so quadrupling n halves the error.</p>`,
      gens: [
        R => { const s = R.int(2, 20), n = R.pick([4, 9, 16, 25, 100]); return num(`The population SD is ${s}, and you take a sample of ${n}. What is the standard error of the mean?`, s / Math.sqrt(n), `σ / √n = ${s} / ${Math.sqrt(n)} = ${round(s / Math.sqrt(n))}.`); },
        () => mc("To estimate how many hours a week NSFs study, which sample is best?", ["A random sample from all units", "Your own bunk", "Volunteers who reply to a poll", "People at the library"], 0, "The others are biased towards particular kinds of people."),
        () => mc("If you make a sample 4 times bigger, the standard error…", ["Halves", "Quarters", "Doubles", "Stays the same"], 0, "SE = σ/√n, and √4 = 2."),
      ] },
    systems: { title: "Solving systems of equations", notes: `
<p>Two equations in x and y are two lines, and the solution is where they cross.</p>
<p><b>Elimination:</b> add or subtract the equations (after scaling one if needed) so one variable cancels.</p>
<p class="small muted">Example: 2x + y = 5 and x − y = 1. Adding gives 3x = 6, so x = 2, then y = 1.</p>
<p>Parallel lines (same slope, different intercept) never cross, so there's no solution.</p>`,
      gens: [
        R => { let a, b, c, d; do { a = R.nz(-3, 4); b = R.nz(-3, 4); c = R.nz(-3, 4); d = R.nz(-3, 4); } while (a * d - b * c === 0); const x = R.int(-5, 5), y = R.int(-5, 5); return num(`Solve ${poly([[a, 1]])} ${b < 0 ? "−" : "+"} ${Math.abs(b) === 1 ? "" : Math.abs(b)}y = ${mi(a * x + b * y)} and ${poly([[c, 1]])} ${d < 0 ? "−" : "+"} ${Math.abs(d) === 1 ? "" : Math.abs(d)}y = ${mi(c * x + d * y)}. What is x?`, x, `Eliminating y gives x = ${x} (and y = ${y}). Check: ${a}×${mi(x)} + ${b}×${mi(y)} = ${a * x + b * y}.`); },
        R => { let a, b, c, d; do { a = R.nz(-3, 4); b = R.nz(-3, 4); c = R.nz(-3, 4); d = R.nz(-3, 4); } while (a * d - b * c === 0); const x = R.int(-5, 5), y = R.int(-5, 5); return num(`Solve ${poly([[a, 1]])} ${b < 0 ? "−" : "+"} ${Math.abs(b) === 1 ? "" : Math.abs(b)}y = ${mi(a * x + b * y)} and ${poly([[c, 1]])} ${d < 0 ? "−" : "+"} ${Math.abs(d) === 1 ? "" : Math.abs(d)}y = ${mi(c * x + d * y)}. What is y?`, y, `Eliminating x gives y = ${y} (and x = ${x}).`); },
        () => mc("y = 2x + 1 and y = 2x + 5. How many solutions are there?", ["None", "One", "Two", "Infinitely many"], 0, "Same slope, different intercepts: the lines are parallel and never meet."),
      ] },
    matmul: { title: "Matrix multiplication", notes: `
<p>A matrix is a grid of numbers. An m×n matrix has m rows and n columns.</p>
<p>To multiply A × B, entry (i, j) is <b>row i of A dotted with column j of B</b>: multiply matching entries, then add.</p>
<p>You can only multiply when A's columns equal B's rows: (m×n)(n×p) gives m×p. Order matters, so AB usually isn't BA.</p>
<p class="small muted">Example: [[1, 2], [3, 4]] × [[5, 6], [7, 8]]. Entry (1, 1) = 1×5 + 2×7 = 19.</p>`,
      gens: [
        R => { const A = [[R.int(-2, 4), R.int(-2, 4)], [R.int(-2, 4), R.int(-2, 4)]], B = [[R.int(-2, 4), R.int(-2, 4)], [R.int(-2, 4), R.int(-2, 4)]], i = R.int(0, 1), j = R.int(0, 1); const v = A[i][0] * B[0][j] + A[i][1] * B[1][j]; return num(`A = [[${A[0].join(", ")}], [${A[1].join(", ")}]] and B = [[${B[0].join(", ")}], [${B[1].join(", ")}]]. What is entry (row ${i + 1}, column ${j + 1}) of AB?`, v, `Row ${i + 1} of A · column ${j + 1} of B = ${A[i][0]}×${B[0][j]} + ${A[i][1]}×${B[1][j]} = ${v}.`); },
        R => { const A = [[R.int(-2, 4), R.int(-2, 4)], [R.int(-2, 4), R.int(-2, 4)]], x = R.int(-3, 3), y = R.int(-3, 3); return num(`A = [[${A[0].join(", ")}], [${A[1].join(", ")}]] and v = [${x}, ${y}] (a column). What is the first entry of Av?`, A[0][0] * x + A[0][1] * y, `${A[0][0]}×${mi(x)} + ${A[0][1]}×${mi(y)} = ${A[0][0] * x + A[0][1] * y}.`); },
        R => { const m = R.int(2, 4), n = R.int(2, 4), p = R.int(2, 5); const right = `${m}×${p}`, wrong = [`${p}×${m}`, `${n}×${n}`, `${m}×${n}`, `${n}×${p}`, `${m + 1}×${p}`, `${m}×${p + 1}`].filter((v, i, a) => v !== right && a.indexOf(v) === i).slice(0, 3); const ch = R.shuffle([right, ...wrong]); return mc(`A is ${m}×${n} and B is ${n}×${p}. What size is AB?`, ch, ch.indexOf(right), `(${m}×${n})(${n}×${p}): the inner ${n}s match, and the outer numbers give ${m}×${p}.`); },
      ] },
    det: { title: "Determinants", notes: `
<p>For a 2×2 matrix [[a, b], [c, d]], the <b>determinant</b> is ad − bc.</p>
<p>If the determinant is 0, the matrix has no inverse, and the matching system of equations has no unique solution (the lines are parallel or the same line).</p>
<p class="small muted">Example: [[2, 1], [1, −1]] has determinant 2×(−1) − 1×1 = −3, so 2x + y = 5, x − y = 1 has exactly one solution.</p>`,
      gens: [
        R => { const a = R.int(-5, 6), b = R.int(-5, 6), c = R.int(-5, 6), d = R.int(-5, 6); return num(`What is the determinant of [[${a}, ${b}], [${c}, ${d}]]?`, a * d - b * c, `ad − bc = ${a}×${mi(d)} − ${b}×${mi(c)} = ${a * d - b * c}.`); },
        R => { const c = R.int(1, 3), a = R.int(1, 6), d = c * R.int(1, 4); return num(`For which k is the determinant of [[${a}, k], [${c}, ${d}]] zero?`, a * d / c, `${a}×${d} − ${c}k = 0, so k = ${a * d}/${c} = ${a * d / c}.`); },
        () => mc("A system's matrix has determinant 0. The system has…", ["No unique solution", "Exactly one solution", "Exactly two solutions", "Only negative solutions"], 0, "Determinant 0 means the lines are parallel or identical."),
      ] },
    check2: { title: "Checkpoint: statistics and matrices", mix: ["describe", "spread", "counting", "conditional", "normal", "binomial", "systems", "matmul", "det"], count: 8, notes: `<p>Eight mixed questions, plus the interview questions from November. Score 80% or more to pass.</p>`,
      fixed: [
        () => num("Interview Q4: solve 2x + y = 5 and x − y = 1. What is x?", 2, "Add them: 3x = 6, so x = 2 (and y = 1)."),
        () => num("Interview Q5: two fair dice. P(total = 7)? (A fraction is fine.)", 1 / 6, "6 of the 36 pairs make 7, so 1/6."),
        () => mc("Interview Q6: the median is…", ["The middle value of the sorted data", "The 25th to 75th percentile range", "The most common value", "The average"], 0, "The 25th to 75th range is the IQR. The median is the 50th percentile."),
      ] },

    // ===== Phase 3: your story and Solver =====
    caseOutline: { title: "Case study: outline", activity: "outline", notes: `
<p>Turn your True Digital Park internship into a one-page case study. Interviewers and scholarship panels love a concrete before-and-after.</p>
<p>Write a line or two under each heading. Use numbers wherever you can: minutes saved, errors avoided, people trained.</p>` },
    caseDraft: { title: "Case study: draft", activity: "draft", notes: `
<p>Turn your outline into paragraphs: about 250 to 400 words in total. Lead with the result.</p>
<p class="small muted">Shape: "At True Digital Park I [result, with a number]. The problem was… I mapped the process and… The SOP I wrote… Next time I would…"</p>` },
    xlookup: { title: "Excel XLOOKUP", notes: `
<p><b>XLOOKUP</b> finds a value in one column and returns the matching value from another:</p>
<p><code>=XLOOKUP(what, look_in, return_from, [if_not_found])</code></p>
<p class="small muted">Example: =XLOOKUP(103, A2:A6, C2:C6) looks for 103 in A2:A6 and returns the price in the same row of C.</p>
<p>If nothing matches, it shows #N/A unless you give the 4th argument (for example, "Not found").</p>
<p>The older <b>VLOOKUP(what, table, col_number, FALSE)</b> only looks right, and breaks if you insert columns. Prefer XLOOKUP.</p>`,
      gens: [
        R => { const items = R.shuffle(["Bolt", "Nut", "Washer", "Gear", "Belt", "Valve", "Sensor"]).slice(0, 5); const prices = items.map(() => R.int(2, 60)); const pick = R.int(0, 4); const rows = items.map((it, i) => `<tr><td>${101 + i}</td><td>${it}</td><td>${prices[i]}</td></tr>`).join(""); return num(`<table class="xl"><tr><th>A: ID</th><th>B: Item</th><th>C: Price</th></tr>${rows}</table>The IDs are in A2:A6 and the prices in C2:C6. What does =XLOOKUP(${101 + pick}, A2:A6, C2:C6) return?`, prices[pick], `${101 + pick} is in row ${pick + 2}, and its price is ${prices[pick]}.`); },
        () => mc("=XLOOKUP(999, A2:A6, C2:C6) and 999 isn't in A2:A6. What do you see?", ["#N/A", "0", "The last price", "999"], 0, "With no 4th argument, a miss shows #N/A."),
        () => mc("In =VLOOKUP(103, A2:C6, 3, FALSE), what does the 3 mean?", ["Return from the 3rd column of the table", "Look in the 3rd row", "Round to 3 decimals", "Find the 3rd match"], 0, "VLOOKUP counts columns from the left of the table range."),
        () => mc("Which argument would show 'Not found' instead of #N/A?", ["The 4th argument of XLOOKUP", "The 2nd argument", "Wrapping it in SUM()", "Sorting the column"], 0, "=XLOOKUP(x, A:A, C:C, \"Not found\")."),
      ] },
    solver: { title: "Optimisation and Excel Solver", notes: `
<p><b>Linear programming</b> (LP) is choosing amounts to get the best result within limits. Every model has three parts:</p>
<p>1. <b>Decision variables:</b> what you choose (x chairs, y tables). 2. <b>Objective:</b> what you maximise or minimise (profit = 30x + 50y). 3. <b>Constraints:</b> the limits (wood: 2x + 4y ≤ 40).</p>
<p>The best answer always sits at a <b>corner</b> of the feasible region, the area allowed by all the constraints. For two variables, check the corners. Excel <b>Solver</b> (and later PuLP in Python) does this search for you on big problems, and it's the core tool of IE2110.</p>
<p class="small muted">In Solver: set the Objective cell, choose Max or Min, set the "By changing" cells to your variables, add constraints, choose Simplex LP, then Solve.</p>`,
      gens: [
        R => {
          let a1, b1, a2, b2; do { a1 = R.int(1, 4); b1 = R.int(1, 4); a2 = R.int(1, 4); b2 = R.int(1, 4); } while (a1 * b2 === a2 * b1);
          const xs = R.int(2, 8), ys = R.int(2, 8), p1 = R.int(2, 9) * 5, p2 = R.int(2, 9) * 5, R1 = a1 * xs + b1 * ys, R2 = a2 * xs + b2 * ys;

    const F = ui.feed, c = F.cards[i];
